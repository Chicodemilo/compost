<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMPOST</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  color: #c8b89a;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  min-height: 100vh;
}
/* The only two horizontal rules on the page. Minor divides items inside a
   group, major divides the groups themselves. Nothing else draws a grey line
   across the page — box outlines are a different thing and stay as they are.

   They are gradients, not borders, so a screen full of them reads as texture
   instead of pinstripes. Major stays anchored at the left and fades out before
   the right edge — it marks where a group begins, so it needs a hard start.
   Minor fades in and out symmetrically and touches neither edge: it only
   separates siblings, so it can float. Every stop is a variable; they are
   meant to be tuned. */
:root {
  --sep: #333;
  --sep-clear: #33333300;
  --sep-solid: 65%;   /* major: holds full strength to here… */
  --sep-gone: 100%;   /* …and is gone by here */
  --sep-fade: 10%;    /* minor: fades in and out over this much of the width, each side */
}
.horz_sep_minor, .horz_sep_major {
  background-repeat: no-repeat;
  background-position: left bottom;
}
.horz_sep_major {
  background-image: linear-gradient(to right,
    var(--sep) var(--sep-solid), var(--sep-clear) var(--sep-gone));
  background-size: 100% 2px;
}
.horz_sep_minor {
  background-image: linear-gradient(to right,
    var(--sep-clear) 0%, var(--sep) var(--sep-fade),
    var(--sep) calc(100% - var(--sep-fade)), var(--sep-clear) 100%);
  background-size: 100% 1px;
}
/* same rule on the upper edge, where the divider belongs to the block below it */
.horz_sep_minor.on_top { background-position: left top; }
.header {
  padding: 20px 24px 16px;
  display: flex; align-items: baseline; gap: 16px;
  position: sticky; top: 0; background-color: #0a0a0a; z-index: 50;
}
.header h1 {
  font-family: 'Special Elite', cursive;
  font-size: 22px; color: #e8d5b5;
  letter-spacing: 3px; text-transform: uppercase;
}
.header .sub { font-size: 11px; color: #555; letter-spacing: 2px; text-transform: uppercase; }
.header .stats { margin-left: auto; font-size: 10px; color: #444; letter-spacing: 1px; }
.searchbar { padding: 18px 24px; }
.searchbar input {
  width: 100%; max-width: 640px;
  background: #111; border: 1px solid #2a2a2a; border-radius: 2px;
  color: #e8d5b5; font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  padding: 10px 14px; outline: none; letter-spacing: 1px;
}
.searchbar input:focus { border-color: #c8b89a; }
.searchbar input::placeholder { color: #555; }
#filters { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
#class-chips { display: flex; gap: 8px; flex-wrap: wrap; }
#mark-filter, #archive-filter { padding-left: 16px; border-left: 1px solid #1f1f1f; }
.chip {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: #555; border: 1px solid #2a2a2a; border-radius: 2px;
  padding: 3px 10px; cursor: pointer; user-select: none;
}
.chip:hover { color: #c8b89a; border-color: #3a3a3a; }
.chip.active { background: #c8b89a; color: #0a0a0a; border-color: #c8b89a; }
.chip.mark-chip { color: #6b7a52; border-color: #262c1e; }
.chip.mark-chip:hover { color: #8f9f6b; border-color: #3a442c; }
.chip.mark-chip.active { background: #8f9f6b; color: #0a0a0a; border-color: #8f9f6b; }
.chip.archive-chip { color: #6b4a28; border-color: #2c2218; }
.chip.archive-chip:hover { color: #b8753a; border-color: #44341f; }
.chip.archive-chip.active { background: #b8753a; color: #0a0a0a; border-color: #b8753a; }
/* the mark: one bit, one axis. a flag that something is here, not a grade */
.mark, .del {
  font-size: 14px; color: #3a3a3a; cursor: pointer; user-select: none;
  letter-spacing: 0; line-height: 1; flex-shrink: 0;
}
.mark { margin-left: auto; padding-left: 10px; }
.del { padding-left: 6px; color: #7a4e24; }
.mark:hover { color: #8f9f6b; }
.mark.on { color: #8f9f6b; }
/* remove reads orange, never the mark's green and never the tags' blue —
   the one control here that takes something away should not look like the
   two that only describe */
.del:hover { color: #c2802e; }
.del.back { color: #4a5a38; }
.del.back:hover { color: #8f9f6b; }
.active-box .mark { margin-left: 0; padding-left: 0; }
#results { padding: 8px 24px 60px; }
.hunk { padding: 14px 0; }
/* the row's controls track the text column instead of the window edge —
   on a wide screen an auto margin strands them yards from the hunk */
.hunk .meta-row { display: flex; gap: 14px; align-items: baseline;
                   margin-bottom: 6px; max-width: 900px; }
.hunk .date, .active-box .date { color: #7a8ab8; font-size: 11px; letter-spacing: 1px; }
.hunk .cls, .active-box .cls {
  font-size: 9px; color: #555; letter-spacing: 2px; text-transform: uppercase;
  border: 1px solid #2a2a2a; border-radius: 2px; padding: 1px 6px;
}
.hunk .dur, .active-box .dur { font-size: 10px; color: #444; }
.hunk .tag, .active-box .tag {
  font-size: 9px; color: #7a8ab8; letter-spacing: 1px;
  border: 1px solid #232a3d; border-radius: 2px; padding: 1px 6px;
}
.hunk .snip { color: #c8b89a; line-height: 1.6; max-width: 900px; }
.hunk .snip mark { background: none; color: #f5e8d0; font-weight: 700; }
.hunk audio, .active-box audio { margin-top: 8px; height: 28px; width: 100%; max-width: 420px; display: block; filter: invert(0.85) sepia(0.3); }
.empty { color: #555; padding: 40px 0; letter-spacing: 2px; text-transform: uppercase; font-size: 11px; }
.year-header {
  cursor: pointer; user-select: none;
  padding: 14px 0;
  font-family: 'Special Elite', cursive;
  font-size: 16px; color: #e8d5b5; letter-spacing: 3px;
}
.year-header:hover { color: #f5e8d0; }
.year-header .arrow { color: #555; display: inline-block; width: 16px; font-family: 'IBM Plex Mono', monospace; }
.year-header .count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #555; letter-spacing: 1px; }
.year-body { padding-left: 16px; }
.loading { color: #555; padding: 12px 0; font-size: 11px; letter-spacing: 2px; }
.header .classes-toggle {
  font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; user-select: none;
}
.header .classes-toggle:hover { color: #c8b89a; }
#classes-panel { display: none; padding: 16px 24px; background-color: #0d0d0c; }
#classes-panel.open { display: block; }
#classes-panel .note { font-size: 10px; color: #555; letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; }
.class-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; max-width: 900px; }
.class-row .cname {
  font-family: 'Special Elite', cursive; font-size: 14px; color: #e8d5b5;
  letter-spacing: 2px; width: 110px; padding-top: 6px; flex-shrink: 0;
}
.class-row input.cname-input, .class-row textarea {
  background: #111; border: 1px solid #2a2a2a; border-radius: 2px;
  color: #c8b89a; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  padding: 6px 8px; outline: none;
}
.class-row input.cname-input { width: 110px; flex-shrink: 0; }
.class-row textarea { flex: 1; resize: vertical; min-height: 68px; line-height: 1.5; }
.class-row textarea:focus, .class-row input.cname-input:focus { border-color: #c8b89a; }
.class-row button {
  background: none; border: 1px solid #2a2a2a; border-radius: 2px; color: #7a8ab8;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; padding: 6px 10px; cursor: pointer; margin-top: 2px;
}
.class-row button:hover { border-color: #c8b89a; color: #e8d5b5; }
.class-row button.retire:hover { border-color: #b87a7a; color: #b87a7a; }

/* ---- active post: random drops one here, clicking a date promotes one ---- */
.header .random {
  font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; user-select: none;
}
.header .random:hover { color: #c8b89a; }
#active { display: none; padding: 16px 24px; }
/* a modal, not a second page: the pile stays visible and dimmed around the
   edges, so it reads as something laid on top that you can put down again */
#active.big {
  position: fixed; inset: 0; z-index: 100; overflow: hidden;
  background-color: rgba(0, 0, 0, 0.72);
  padding: 25px;
}
#active.big .active-box {
  max-width: none; height: 100%; overflow-y: auto;
  display: flex; flex-direction: column;
  border-color: #3a3a3a;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.8);
}
/* the point of filling the screen is room to write, so the notes box takes
   what is left over rather than staying its usual 150px */
#active.big textarea.notes { flex: 1; min-height: 200px; }
#active.big .full { max-height: 26vh; }
@media (max-width: 600px)  { #active.big { padding: 5px; } }
@media (min-width: 1200px) { #active.big { padding: 40px; } }
#active.open { display: block; }
.active-box {
  border: 1px solid #2a2a2a; border-radius: 2px;
  background: #0d0d0c; padding: 14px 16px; max-width: 900px;
}
.active-box .top { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 12px; }
.active-box .label {
  font-family: 'Special Elite', cursive; font-size: 13px; color: #e8d5b5;
  letter-spacing: 3px; text-transform: uppercase;
}
/* two vocabularies, split by what the control touches. words act on the hunk
   ([archive], [back]); bracket glyphs act on the panel ([<->], [x]). the mark is
   a glyph too, because it reports a state rather than doing anything. */
.active-box .act {
  font-size: 11px; color: #555; cursor: pointer; user-select: none;
  letter-spacing: 0; line-height: 1; flex-shrink: 0;
}
.active-box .act:first-of-type { margin-left: auto; }
.active-box .act:hover { color: #c8b89a; }
.active-box .act.close:hover { color: #b87a7a; }
/* ascii on purpose. the unicode expand glyphs either tofu in this stack or
   fall through to the emoji font, and [<>] / [><] carries its own direction
   anyway. the dash is what makes it read as an arrow rather than an empty
   tag — pushing out, then pulling back in */
.active-box .act.glyph { font-size: 12px; }
.active-box .act.glyph.on { color: #c8b89a; }
.deets { display: grid; grid-template-columns: 92px 1fr; gap: 5px 14px; font-size: 11px; margin-bottom: 12px; }
.deets .k { color: #555; letter-spacing: 2px; text-transform: uppercase; }
.deets .v { color: #c8b89a; word-break: break-all; }
.pathlink { color: #7a8ab8; cursor: pointer; border-bottom: 1px dotted #3a4560; }
.pathlink:hover { color: #e8d5b5; border-bottom-color: #e8d5b5; }
.full {
  max-height: 340px; overflow-y: auto; line-height: 1.7; white-space: pre-wrap;
  padding-top: 12px; color: #c8b89a;
}
.notes-head {
  display: flex; align-items: baseline; gap: 10px;
  margin-top: 14px; padding-top: 12px;
}
.notes-head .lbl {
  font-family: 'Special Elite', cursive; font-size: 12px; color: #e8d5b5;
  letter-spacing: 3px; text-transform: uppercase;
}
.notes-head .count { font-size: 10px; color: #555; letter-spacing: 1px; }
.notes-head .count.near { color: #b8753a; }
.notes-head .count.full { color: #b87a7a; }
.notes-head .state { margin-left: auto; font-size: 9px; color: #555; letter-spacing: 2px;
                     text-transform: uppercase; }
.notes-head .state.saving { color: #7a8ab8; }
.notes-head .state.saved { color: #8f9f6b; }
.notes-head .state.failed { color: #b87a7a; }
/* fixed height on purpose: it scrolls, it does not grow, so the box never
   pushes the transcript and the audio off the screen as notes pile up */
textarea.notes {
  width: 100%; margin-top: 8px; height: 150px; resize: none; overflow-y: auto;
  background: #111; border: 1px solid #2a2a2a; border-radius: 2px;
  color: #e8d5b5; font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  line-height: 1.7; padding: 10px 12px; outline: none;
}
textarea.notes:focus { border-color: #c8b89a; }
textarea.notes::placeholder { color: #3a3a3a; }
.hunk .title, .active-box .title { color: #e8d5b5; font-size: 12px; letter-spacing: 1px; }
.hunk .title.none, .active-box .title.none { color: #3a3a3a; font-style: italic; letter-spacing: 0; }
.hunk .date.pick { cursor: pointer; }
.hunk .date.pick:hover { color: #e8d5b5; border-bottom: 1px dotted #7a8ab8; }
</style>
</head>
<body>
<div class="header horz_sep_major">
  <h1>Compost</h1>
  <span class="stats" id="stats"></span>
  <span class="random" onclick="randomPost()">random</span>
  <span class="classes-toggle" onclick="toggleClasses()">classes</span>
</div>
<div id="classes-panel" class="horz_sep_minor">
  <div class="note">edits fall forward — the clerk files future memos by these; already-filed hunks keep their label</div>
  <div id="class-rows"></div>
</div>
<div id="active" class="horz_sep_major"></div>
<div class="searchbar horz_sep_minor">
  <input id="q" type="search" placeholder="search the pile…" autofocus autocomplete="off">
  <div id="filters">
    <div id="class-chips"></div>
    <div id="mark-filter">
      <span class="chip mark-chip" id="mark-chip" onclick="toggleMarkFilter()"
            title="only hunks flagged as having something in them">something here</span>
    </div>
    <div id="archive-filter">
      <span class="chip archive-chip" id="archive-chip" onclick="toggleArchivedFilter()"
            title="the hunks you put out of view — nothing was deleted">archived</span>
    </div>
  </div>
</div>
<div id="results"></div>
<script>
const q = document.getElementById('q');
const results = document.getElementById('results');
const stats = document.getElementById('stats');
let timer = null;

function fmtDate(iso) {
  return iso ? iso.slice(0, 16).replace('T', ' · ') : '?';
}
function fmtDur(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return m ? `${m}m${String(sec).padStart(2,'0')}s` : `${sec}s`;
}

function hunkHTML(e) {
  return `
    <div class="hunk horz_sep_minor">
      <div class="meta-row">
        <span class="date pick" onclick="setActive('${e.id}')"
              title="make this the active post">${fmtDate(e.created_at)}</span>
        ${e.title ? `<span class="title">${esc(e.title)}</span>` : ''}
        <span class="cls">${e.class}</span>
        ${(e.tags || '').split(',').filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('')}
        <span class="dur">${fmtDur(e.duration)}</span>
        ${markHTML(e)}${delHTML(e)}
      </div>
      <div class="snip">${e.snip || '<span style="color:#444">(no transcript)</span>'}</div>
      <audio controls preload="none" src="/audio/${encodeURIComponent(e.audio_path.replace(/^audio\//,''))}"></audio>
    </div>`;
}

let statsData = null;
function setStats(data) {
  statsData = data;
  stats.textContent = `${data.total} hunks · ${(data.oldest||'').slice(0,4)}–${(data.newest||'').slice(0,4)}`;
}

const expanded = new Set();       // survives search-and-clear
const yearCache = new Map();      // "year|filter" -> hunks, fetched once
const activeCls = new Set();      // class filter; empty = no filter
let markOn = false;               // the other axis, filtered on its own
let archiveOn = false;             // showing the archived pile instead of the live one
const chipRow = document.getElementById('class-chips');
const markChip = document.getElementById('mark-chip');
const archiveChip = document.getElementById('archive-chip');

const clsParam = () => [...activeCls].join(',');
const filterParams = () =>
  `cls=${clsParam()}&mark=${markOn ? 1 : 0}&archived=${archiveOn ? 1 : 0}`;
const cacheKey = year => `${year}|${clsParam()}|${markOn ? 1 : 0}|${archiveOn ? 1 : 0}`;

function markHTML(e) {
  const on = e.status === 'promoted';
  return `<span class="mark${on ? ' on' : ''}" data-id="${e.id}"
                onclick="toggleMark('${e.id}', event)"
                title="${on ? 'there is something here' : 'flag: something here'}"
          >${on ? '[&bull;]' : '[&nbsp;]'}</span>`;
}

async function toggleMark(id, ev) {
  ev.stopPropagation();
  const on = ev.currentTarget.classList.contains('on');
  const r = await fetch('/api/mark', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, mark: !on})
  });
  if (!r.ok) { alert(await r.text()); return; }
  applyMark(id, (await r.json()).status === 'promoted');
}

// patch in place rather than re-render: a re-render would restart the audio,
// and an unmarked row shouldn't vanish out from under the cursor
function applyMark(id, on) {
  document.querySelectorAll(`.mark[data-id="${id}"]`).forEach(el => {
    el.classList.toggle('on', on);
    el.innerHTML = on ? '[&bull;]' : '[&nbsp;]';
    el.title = on ? 'there is something here' : 'flag: something here';
  });
  const st = on ? 'promoted' : 'raw';
  yearCache.forEach(list => list.forEach(e => { if (e.id === id) e.status = st; }));
  document.querySelectorAll(`[data-status-for="${id}"]`).forEach(el => el.textContent = st);
  if (activeHunk && activeHunk.id === id) activeHunk.status = st;
}

const DEL_TITLE = 'put out of view — nothing is deleted, find it again under "archived"';
const BACK_TITLE = 'put this back in the pile';

function delHTML(e) {
  const hid = !!e.archived;
  return `<span class="del${hid ? ' back' : ''}" data-del="${e.id}"
                onclick="archiveHunk('${e.id}', ${!hid}, event)"
                title="${hid ? BACK_TITLE : DEL_TITLE}"
          >${hid ? '[back]' : '[archive]'}</span>`;
}

// one click, both directions. this used to ask twice, from when [x] meant
// delete — but archiving moves nothing and the archived chip puts it back in a
// tap, so a confirm step was just ceremony in front of a reversible act.
async function archiveHunk(id, archive, ev) {
  ev.stopPropagation();
  const r = await fetch('/api/archive', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, archive})
  });
  if (!r.ok) { alert(await r.text()); return; }
  dropHunk(id);   // it left whichever view you are in — the live one or the archived one
}

function dropHunk(id) {
  yearCache.forEach((list, key) =>
    yearCache.set(key, list.filter(e => e.id !== id)));
  if (activeHunk && activeHunk.id === id) renderActive(null);
  document.querySelectorAll(`[data-del="${id}"]`).forEach(d => {
    const row = d.closest('.hunk');
    if (!row) return;
    bumpCount(row.closest('.year-body'), -1);   // the year it was filed under
    row.remove();
  });
  if (statsData) { statsData.total--; setStats(statsData); }
}

// a deleted hunk stops being counted immediately — waiting for the next
// fetch leaves the page insisting on a number it can no longer show
function bumpCount(yearBody, by) {
  const el = yearBody && yearBody.previousElementSibling.querySelector('.count');
  if (!el) return;   // search results have no year headers
  el.textContent = el.textContent.replace(/\d+/, n => Math.max(0, +n + by));
}

function toggleMarkFilter() {
  markOn = !markOn;
  markChip.classList.toggle('active', markOn);
  search();
}

function toggleArchivedFilter() {
  archiveOn = !archiveOn;
  archiveChip.classList.toggle('active', archiveOn);
  expanded.clear();   // the two piles share no years; stale folds would mislead
  search();
}

function renderChips(classes) {
  chipRow.innerHTML = classes.map(c =>
    `<span class="chip${activeCls.has(c) ? ' active' : ''}" onclick="toggleCls('${c}')">${c}</span>`
  ).join('');
}

function toggleCls(c) {
  activeCls.has(c) ? activeCls.delete(c) : activeCls.add(c);
  [...chipRow.children].forEach(el =>
    el.classList.toggle('active', activeCls.has(el.textContent)));
  search();  // re-run whichever view is up, filtered
}

async function search() {
  if (!q.value.trim()) return showYears();
  const r = await fetch(`/api/search?q=${encodeURIComponent(q.value)}&${filterParams()}`);
  const data = await r.json();
  if (!q.value.trim()) return;    // box was cleared while fetching
  setStats(data);
  results.innerHTML = data.results.length
    ? data.results.map(hunkHTML).join('')
    : '<div class="empty">nothing in the pile matches</div>';
}

async function showYears() {
  const r = await fetch('/api/search?' + filterParams());
  const data = await r.json();
  if (q.value.trim()) return;     // user started typing while fetching
  setStats(data);
  renderChips(data.classes);
  results.innerHTML = data.years.map(y => `
    <div class="year">
      <div class="year-header horz_sep_major" onclick="toggleYear('${y.year}')">
        <span class="arrow">&#9656;</span>${y.year} <span class="count">· ${y.count} hunks</span>
      </div>
      <div class="year-body" id="yr-${y.year}"></div>
    </div>`).join('');
  expanded.forEach(renderYear);   // restore fold state after a cleared search
}

async function renderYear(year) {
  const body = document.getElementById('yr-' + year);
  if (!body) return;
  body.previousElementSibling.querySelector('.arrow').innerHTML = '&#9662;';
  const key = cacheKey(year);
  if (!yearCache.has(key)) {
    body.innerHTML = '<div class="loading">digging…</div>';
    const r = await fetch(`/api/search?year=${year}&${filterParams()}`);
    yearCache.set(key, (await r.json()).results);
  }
  if (!expanded.has(year)) return;  // collapsed again while fetching
  body.innerHTML = yearCache.get(key).map(hunkHTML).join('');
}

function toggleYear(year) {
  const body = document.getElementById('yr-' + year);
  if (expanded.has(year)) {
    expanded.delete(year);
    body.innerHTML = '';
    body.previousElementSibling.querySelector('.arrow').innerHTML = '&#9656;';
  } else {
    expanded.add(year);
    renderYear(year);
  }
}

// ---- class roster CRUD (edits fall forward only) ----
const panel = document.getElementById('classes-panel');
const classRows = document.getElementById('class-rows');

function toggleClasses() {
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) loadClasses();
}

async function loadClasses() {
  const classes = await (await fetch('/api/classes')).json();
  classRows.innerHTML = Object.hunks(classes).map(([name, writeup]) => `
    <div class="class-row">
      <span class="cname">${name}</span>
      <textarea id="cw-${name}">${writeup.replace(/</g, '&lt;')}</textarea>
      <button onclick="saveClass('${name}')">save</button>
      ${name === 'compost' ? '' : `<button class="retire" onclick="retireClass('${name}')">retire</button>`}
    </div>`).join('') + `
    <div class="class-row">
      <input class="cname-input" id="new-cname" placeholder="new class" autocomplete="off">
      <textarea id="new-cwriteup" placeholder="write-up the clerk will file by…"></textarea>
      <button onclick="addClass()">add</button>
    </div>`;
}

async function postClass(name, writeup) {
  const r = await fetch('/api/classes', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, writeup})
  });
  if (!r.ok) { alert(await r.text()); return false; }
  return true;
}
async function saveClass(name) {
  if (await postClass(name, document.getElementById('cw-' + name).value)) loadClasses();
}
async function addClass() {
  const name = document.getElementById('new-cname').value.trim();
  const writeup = document.getElementById('new-cwriteup').value.trim();
  if (name && writeup && await postClass(name, writeup)) loadClasses();
}
async function retireClass(name) {
  const r = await fetch('/api/classes/' + encodeURIComponent(name), {method: 'DELETE'});
  if (!r.ok) alert(await r.text());
  loadClasses();
}

// one voice at a time: starting any player pauses the rest
document.addEventListener('play', ev => {
  document.querySelectorAll('audio').forEach(a => { if (a !== ev.target) a.pause(); });
}, true);

// ---- active post: survives searches and reloads until cleared ----
const activeWrap = document.getElementById('active');
let activeHunk = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nfmt = n => n.toLocaleString();
const words = t => { const x = (t || '').trim(); return x ? x.split(/\s+/).length : 0; };

function deetRows(e) {
  const rows = [
    ['id', esc(e.id)],
    ['source', esc(e.source)],
    ['status', `<span data-status-for="${esc(e.id)}">${esc(e.status)}</span>`],
    ['indexed', esc(fmtDate(e.indexed_at))],
    ['length', `${nfmt(words(e.transcript))} words · ${nfmt((e.transcript || '').length)} chars`],
    ['file', `<span class="pathlink" onclick="revealActive()"
                    title="reveal in Finder">${esc(e.audio_path)}</span>`],
  ];
  // schema carries location but nothing has ever filled it — show only if it does
  const place = e.place || (e.lat != null && e.lon != null ? `${e.lat}, ${e.lon}` : '');
  if (place) rows.push(['place', esc(place)]);
  return rows.map(([k, v]) => `<span class="k">${k}</span><span class="v">${v}</span>`).join('');
}

function renderActive(e) {
  flushNotes();        // the box is about to be replaced — don't let a pending save die with it
  activeWrap.classList.remove('big');
  activeHunk = e;
  notesSaved = e ? (e.notes || '') : null;
  if (!e) {
    activeWrap.classList.remove('open');
    activeWrap.innerHTML = '';
    localStorage.removeItem('compost.active');
    return;
  }
  localStorage.setItem('compost.active', e.id);
  activeWrap.innerHTML = `
    <div class="active-box">
      <div class="top">
        <span class="label">active hunk</span>
        ${markHTML(e)}${delHTML(e)}
        <span class="date">${fmtDate(e.created_at)}</span>
        ${e.title ? `<span class="title">${esc(e.title)}</span>`
                  : '<span class="title none">unnamed</span>'}
        <span class="cls">${esc(e.class)}</span>
        ${(e.tags || '').split(',').filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
        <span class="dur">${fmtDur(e.duration)}</span>
        <span class="act glyph" onclick="toggleBig()" id="big-btn"
              title="fill the screen — more room to write">[&lt;-&gt;]</span>
        <span class="act glyph close" onclick="renderActive(null)"
              title="put the active hunk away">[x]</span>
      </div>
      <div class="deets">${deetRows(e)}</div>
      <audio controls preload="none"
             src="/audio/${encodeURIComponent(e.audio_path.replace(/^audio\//, ''))}"></audio>
      <div class="full horz_sep_minor on_top">${esc(e.transcript) || '<span style="color:#444">(no transcript)</span>'}</div>
      <div class="notes-head horz_sep_minor on_top">
        <span class="lbl">notes</span>
        <span class="count" id="notes-count"></span>
        <span class="state" id="notes-state"></span>
      </div>
      <textarea class="notes" id="notes-box" spellcheck="true" maxlength="${MAX_NOTES}"
                placeholder="work it out here…">${esc(e.notes || '')}</textarea>
    </div>`;
  const box = document.getElementById('notes-box');
  showCount(box.value.length);
  box.addEventListener('input', () => {
    showCount(box.value.length);
    notesState('');
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => saveNotes(e.id, box.value), 800);
  });
  box.addEventListener('blur', () => {
    clearTimeout(notesTimer);
    saveNotes(e.id, box.value);
  });
  activeWrap.classList.add('open');
}

// notes save themselves: a note you have to remember to save is a note you
// lose. debounced while typing, flushed the moment focus leaves.
const MAX_NOTES = 10000;   // keep in step with MAX_NOTES in server.py
let notesTimer = null, notesSaved = null;

function notesState(cls, text) {
  const el = document.getElementById('notes-state');
  if (!el) return;
  el.className = 'state ' + cls;
  el.textContent = text || '';
}

function showCount(n) {
  const el = document.getElementById('notes-count');
  if (!el) return;
  el.className = 'count' + (n >= MAX_NOTES ? ' full' : n > MAX_NOTES * 0.9 ? ' near' : '');
  el.textContent = `${n}/${MAX_NOTES} chars`;
}

// anything that destroys the textarea has to flush first. removing a focused
// element does not reliably fire blur, so the debounce alone would drop the
// last thing typed before clearing or switching the active post.
function flushNotes() {
  clearTimeout(notesTimer);
  const box = document.getElementById('notes-box');
  if (box && activeHunk) saveNotes(activeHunk.id, box.value);
}

async function saveNotes(id, text) {
  if (text === notesSaved) return;        // nothing changed since the last write
  notesState('saving', 'saving…');
  try {
    const r = await fetch('/api/notes', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id, text})
    });
    if (!r.ok) throw new Error(await r.text());
    const e = await r.json();
    notesSaved = text;
    if (activeHunk && activeHunk.id === id) activeHunk.notes = e.notes;
    notesState('saved', 'saved ' + new Date().toTimeString().slice(0, 5));
  } catch (err) {
    notesState('failed', 'not saved');
  }
}

function toggleBig(force) {
  const on = force !== undefined ? force : !activeWrap.classList.contains('big');
  activeWrap.classList.toggle('big', on);
  const btn = document.getElementById('big-btn');
  if (btn) {
    btn.innerHTML = on ? '[&gt;-&lt;]' : '[&lt;-&gt;]';   // pushing out, then pulling back in
    btn.classList.toggle('on', on);
    btn.title = on ? 'back to the page (or hit escape)'
                   : 'fill the screen — more room to write';
  }
  if (on) document.getElementById('notes-box')?.focus();
}

// clicking the dimmed margin puts it down, the way a modal should. the test
// is target === the container, so a click anywhere inside the box is ignored.
activeWrap.addEventListener('click', ev => {
  if (ev.target === activeWrap && activeWrap.classList.contains('big')) toggleBig(false);
});

// escape gets you out of the big view and only out of it — it never puts the
// hunk away, because losing your place is not what escape is for
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && activeWrap.classList.contains('big')) toggleBig(false);
});

async function setActive(id) {
  const r = await fetch('/api/hunk?id=' + encodeURIComponent(id));
  if (!r.ok) return;
  renderActive(await r.json());
}

async function randomPost() {
  const r = await fetch('/api/random?' + filterParams());
  if (!r.ok) return;
  renderActive(await r.json());
  window.scrollTo({top: 0, behavior: 'smooth'});
}

async function revealActive() {
  if (!activeHunk) return;
  const r = await fetch('/api/reveal', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({path: activeHunk.audio_path})
  });
  if (!r.ok) alert(await r.text());
}

// closing the tab mid-sentence: a normal fetch gets cancelled, a beacon does not
window.addEventListener('pagehide', () => {
  clearTimeout(notesTimer);
  const box = document.getElementById('notes-box');
  if (!box || !activeHunk || box.value === notesSaved) return;
  navigator.sendBeacon('/api/notes', new Blob(
    [JSON.stringify({id: activeHunk.id, text: box.value})], {type: 'application/json'}));
});

q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 200); });
search();
const savedActive = localStorage.getItem('compost.active');
if (savedActive) setActive(savedActive);
</script>
