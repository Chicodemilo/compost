<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMPOST</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  color: #c8b89a;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  min-height: 100vh;
}
/* The only two horizontal rules on the page. Minor divides items inside a
   group, major divides the groups themselves. Nothing else draws a grey line
   across the page — box outlines are a different thing and stay as they are.

   They are gradients, not borders, so a screen full of them reads as texture
   instead of pinstripes. Major stays anchored at the left and fades out before
   the right edge — it marks where a group begins, so it needs a hard start.
   Minor fades in and out symmetrically and touches neither edge: it only
   separates siblings, so it can float. Every stop is a variable; they are
   meant to be tuned. */
:root {
  --sep: #333;
  --sep-clear: #33333300;
  --sep-solid: 65%;   /* major: holds full strength to here… */
  --sep-gone: 100%;   /* …and is gone by here */
  --sep-fade: 10%;    /* minor: fades in and out over this much of the width, each side */
}
.horz_sep_minor, .horz_sep_major {
  background-repeat: no-repeat;
  background-position: left bottom;
}
.horz_sep_major {
  background-image: linear-gradient(to right,
    var(--sep) var(--sep-solid), var(--sep-clear) var(--sep-gone));
  background-size: 100% 2px;
}
.horz_sep_minor {
  background-image: linear-gradient(to right,
    var(--sep-clear) 0%, var(--sep) var(--sep-fade),
    var(--sep) calc(100% - var(--sep-fade)), var(--sep-clear) 100%);
  background-size: 100% 1px;
}
/* same rule on the upper edge, where the divider belongs to the block below it */
.horz_sep_minor.on_top { background-position: left top; }
.header {
  padding: 20px 24px 16px;
  display: flex; align-items: baseline; gap: 16px;
  position: sticky; top: 0; background-color: #0a0a0a; z-index: 50;
}
.header h1 {
  font-family: 'Special Elite', cursive;
  font-size: 22px; color: #e8d5b5;
  letter-spacing: 3px; text-transform: uppercase;
}
.header .sub { font-size: 11px; color: #555; letter-spacing: 2px; text-transform: uppercase; }
.header .stats { margin-left: auto; font-size: 10px; color: #444; letter-spacing: 1px; }
.searchbar { padding: 18px 24px; }
.searchbar input {
  width: 100%; max-width: 640px;
  background: #111; border: 1px solid #2a2a2a; border-radius: 2px;
  color: #e8d5b5; font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  padding: 10px 14px; outline: none; letter-spacing: 1px;
}
.searchbar input:focus { border-color: #c8b89a; }
.searchbar input::placeholder { color: #555; }
#filters { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
#class-chips { display: flex; gap: 8px; flex-wrap: wrap; }
#mark-filter, #archive-filter { padding-left: 16px; border-left: 1px solid #1f1f1f; }
.chip {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: #555; border: 1px solid #2a2a2a; border-radius: 2px;
  padding: 3px 10px; cursor: pointer; user-select: none;
}
.chip:hover { color: #c8b89a; border-color: #3a3a3a; }
.chip.active { background: #c8b89a; color: #0a0a0a; border-color: #c8b89a; }
.chip.mark-chip { color: #6b7a52; border-color: #262c1e; }
.chip.mark-chip:hover { color: #8f9f6b; border-color: #3a442c; }
.chip.mark-chip.active { background: #8f9f6b; color: #0a0a0a; border-color: #8f9f6b; }
.chip.archive-chip { color: #6b4a28; border-color: #2c2218; }
.chip.archive-chip:hover { color: #b8753a; border-color: #44341f; }
.chip.archive-chip.active { background: #b8753a; color: #0a0a0a; border-color: #b8753a; }
/* the mark: one bit, one axis. a flag that something is here, not a grade */
.mark, .del {
  font-size: 14px; color: #3a3a3a; cursor: pointer; user-select: none;
  letter-spacing: 0; line-height: 1; flex-shrink: 0;
}
.mark { padding-left: 10px; }
/* the two row controls travel as one unit, so a wrapping row can never strand
   [archive] on a line by itself while the mark stays pinned right */
.hunk .ctrls { margin-left: auto; display: inline-flex; align-items: baseline; flex-shrink: 0; }
.del { padding-left: 6px; color: #7a4e24; }
.mark:hover { color: #8f9f6b; }
.mark.on { color: #8f9f6b; }
/* remove reads orange, never the mark's green and never the tags' blue —
   the one control here that takes something away should not look like the
   two that only describe */
.del:hover { color: #c2802e; }
.del.back { color: #4a5a38; }
.del.back:hover { color: #8f9f6b; }
.active-box .mark { margin-left: 0; padding-left: 0; }
#results { padding: 8px 24px 60px; }
.hunk { padding: 14px 0; }
/* the controls sit out at the right edge. they were pulled in to the text
   column back when the separators were nearly invisible and a control out
   there looked unmoored — the brighter rules give them a line to sit on. */
.hunk .meta-row { display: flex; gap: 14px; align-items: baseline;
                   margin-bottom: 6px; }
.hunk .ctrls { padding-right: 6px; }
.hunk .date, .active-box .date { color: #7a8ab8; font-size: 11px; letter-spacing: 1px; }
.hunk .cls, .active-box .cls {
  font-size: 9px; color: #555; letter-spacing: 2px; text-transform: uppercase;
  border: 1px solid #2a2a2a; border-radius: 2px; padding: 1px 6px;
}
.hunk .dur, .active-box .dur { font-size: 10px; color: #444; }
.hunk .tag, .active-box .tag {
  font-size: 9px; color: #7a8ab8; letter-spacing: 1px;
  border: 1px solid #232a3d; border-radius: 2px; padding: 1px 6px;
}
.hunk .snip { color: #c8b89a; line-height: 1.6; max-width: 900px; }
.hunk .snip mark { background: none; color: #f5e8d0; font-weight: 700; }
.hunk audio, .active-box audio { margin-top: 8px; height: 28px; width: 100%; max-width: 420px; display: block; filter: invert(0.85) sepia(0.3); }
.empty { color: #555; padding: 40px 0; letter-spacing: 2px; text-transform: uppercase; font-size: 11px; }
.year-header {
  cursor: pointer; user-select: none;
  padding: 14px 0;
  font-family: 'Special Elite', cursive;
  font-size: 16px; color: #e8d5b5; letter-spacing: 3px;
}
.year-header:hover { color: #f5e8d0; }
.year-header .arrow { color: #555; display: inline-block; width: 16px; font-family: 'IBM Plex Mono', monospace; }
.year-header .count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #555; letter-spacing: 1px; }
.year-body { padding-left: 16px; }
.loading { color: #555; padding: 12px 0; font-size: 11px; letter-spacing: 2px; }
.header .classes-toggle {
  font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; user-select: none;
}
.header .classes-toggle:hover { color: #c8b89a; }
#classes-panel { display: none; padding: 16px 24px; background-color: #0d0d0c; }
#classes-panel.open { display: block; }
#classes-panel .note { font-size: 10px; color: #555; letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; }
.class-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; max-width: 900px; }
.class-row .cname {
  font-family: 'Special Elite', cursive; font-size: 14px; color: #e8d5b5;
  letter-spacing: 2px; width: 110px; padding-top: 6px; flex-shrink: 0;
}
.class-row input.cname-input, .class-row textarea {
  background: #111; border: 1px solid #2a2a2a; border-radius: 2px;
  color: #c8b89a; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  padding: 6px 8px; outline: none;
}
.class-row input.cname-input { width: 110px; flex-shrink: 0; }
.class-row textarea { flex: 1; resize: vertical; min-height: 68px; line-height: 1.5; }
.class-row textarea:focus, .class-row input.cname-input:focus { border-color: #c8b89a; }
.class-row button {
  background: none; border: 1px solid #2a2a2a; border-radius: 2px; color: #7a8ab8;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; padding: 6px 10px; cursor: pointer; margin-top: 2px;
}
.class-row button:hover { border-color: #c8b89a; color: #e8d5b5; }
.class-row button.retire:hover { border-color: #b87a7a; color: #b87a7a; }

/* ---- active post: random drops one here, clicking a date promotes one ---- */
.header .random {
  font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; user-select: none;
}
.header .random:hover { color: #c8b89a; }
#active { display: none; padding: 16px 24px; }
/* a modal, not a second page: the pile stays visible and dimmed around the
   edges, so it reads as something laid on top that you can put down again */
#active.big {
  position: fixed; inset: 0; z-index: 100; overflow: hidden;
  background-color: rgba(0, 0, 0, 0.72);
  padding: 25px;
}
#active.big .active-box {
  max-width: none; height: 100%; overflow-y: auto;
  display: flex; flex-direction: column;
  border-color: #3a3a3a;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.8);
}
/* the point of filling the screen is room to write, so the notes box takes
   what is left over rather than staying its usual 150px */

#active.big .full { max-height: 26vh; }
@media (min-width: 1200px) { #active.big { padding: 40px; } }
/* phone. a first pass, not a finished design: claw back the side padding,
   let the rows wrap instead of squeezing the tags, and shrink the panels so
   the transcript is not reading through a letterbox. */
@media (max-width: 600px) {
  .header { padding: 14px 14px 12px; gap: 10px; flex-wrap: wrap; }
  .header h1 { font-size: 18px; letter-spacing: 2px; }
  .header .stats { font-size: 9px; }
  .searchbar { padding: 14px; }
  #results { padding: 8px 14px 48px; }
  #active, #classes-panel { padding: 14px; }
  #active.big { padding: 5px; }
  .active-box { padding: 12px; }
  .hunk .meta-row { flex-wrap: wrap; gap: 8px 10px; max-width: none; }
  /* once the row wraps, the pair rides with the content instead of pinning right */
  .hunk .ctrls { margin-left: 0; }
  .hunk .mark { padding-left: 0; }
  .deets { grid-template-columns: 70px 1fr; gap: 4px 10px; }
  .full { max-height: 220px; }
  .year-header { font-size: 14px; letter-spacing: 2px; }
  .class-row { flex-wrap: wrap; }
  .class-row .cname, .class-row input.cname-input { width: 100%; }
}
#active.open { display: block; }
.active-box {
  border: 1px solid #2a2a2a; border-radius: 2px;
  background: #0d0d0c; padding: 14px 16px; max-width: 900px;
}
.active-box .top { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 12px; }
.active-box .label {
  font-family: 'Special Elite', cursive; font-size: 13px; color: #e8d5b5;
  letter-spacing: 3px; text-transform: uppercase;
}
/* two vocabularies, split by what the control touches. words act on the hunk
   ([archive], [back]); bracket glyphs act on the panel ([<->], [x]). the mark is
   a glyph too, because it reports a state rather than doing anything. */
.active-box .act {
  font-size: 11px; color: #555; cursor: pointer; user-select: none;
  letter-spacing: 0; line-height: 1; flex-shrink: 0;
}
.active-box .act:first-of-type { margin-left: auto; }
.active-box .act:hover { color: #c8b89a; }
.active-box .act.close:hover { color: #b87a7a; }
/* ascii on purpose. the unicode expand glyphs either tofu in this stack or
   fall through to the emoji font, and [<>] / [><] carries its own direction
   anyway. the dash is what makes it read as an arrow rather than an empty
   tag — pushing out, then pulling back in */
.active-box .act.glyph { font-size: 12px; }
.active-box .act.glyph.on { color: #c8b89a; }
.deets { display: grid; grid-template-columns: 92px 1fr; gap: 5px 14px; font-size: 11px; margin-bottom: 12px; }
.deets .k { color: #555; letter-spacing: 2px; text-transform: uppercase; }
.deets .v { color: #c8b89a; word-break: break-all; }
.pathlink { color: #7a8ab8; cursor: pointer; border-bottom: 1px dotted #3a4560; }
.pathlink:hover { color: #e8d5b5; border-bottom-color: #e8d5b5; }
.full {
  max-height: 340px; overflow-y: auto; line-height: 1.7; white-space: pre-wrap;
  padding-top: 12px; color: #c8b89a;
}
.notes-head {
  display: flex; align-items: baseline; gap: 10px;
  margin-top: 14px; padding-top: 12px;
}
.notes-head .lbl {
  font-family: 'Special Elite', cursive; font-size: 12px; color: #e8d5b5;
  letter-spacing: 3px; text-transform: uppercase;
}
.notes-head .count { font-size: 10px; color: #555; letter-spacing: 1px; }
.notes-head .count.near { color: #b8753a; }
.notes-head .count.full { color: #b87a7a; }
.notes-head .state { margin-left: auto; font-size: 9px; color: #555; letter-spacing: 2px;
                     text-transform: uppercase; }
.notes-head .state.saving { color: #7a8ab8; }
.notes-head .state.saved { color: #8f9f6b; }
.notes-head .state.failed { color: #b87a7a; }
/* the panel is absolutely placed in here and clipped by it, so its shadow
   falls inside the writing area and never bleeds onto the page behind */
#notes-area { position: relative; overflow: hidden; margin-top: 8px; }
#active.big #notes-area { flex: 1; display: flex; flex-direction: column; min-height: 200px; }
#active.big #notes-area > textarea.notes, #active.big #notes-area > #notes-lanes { flex: 1; }
/* fixed height on purpose: it scrolls, it does not grow, so the box never
   pushes the transcript and the audio off the screen as notes pile up */
textarea.notes {
  width: 100%; margin-top: 0; height: 150px; resize: none; overflow-y: auto;
  background: #111; border: 1px solid #2a2a2a; border-radius: 2px;
  color: #e8d5b5; font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  line-height: 1.7; padding: 10px 12px; outline: none;
}
textarea.notes:focus { border-color: #c8b89a; }
textarea.notes::placeholder { color: #3a3a3a; }
/* only in the big view, where the player has scrolled off the top and you are
   writing against a tape you can no longer reach */
.ribbon { display: none; }
#active.big .ribbon {
  display: block;
  position: sticky; bottom: 0; margin-top: 10px;
  padding: 8px 2px 4px; background-color: #0d0d0c;
}
/* ascii tabs: the slashes do the work, so it reads as a tab strip in a
   typewriter face without a single box-drawing character to go missing.
   the rule is continuous — it runs under every tab and on to the end. */
.ribbon .rb-tabs {
  display: flex; align-items: flex-end;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  white-space: pre; user-select: none; overflow: hidden;
}
.ribbon .rb-tab { color: #4a4a4a; cursor: pointer; }      /* a shut folder */
.ribbon .rb-tab:hover { color: #8a8a8a; }
.ribbon .rb-tab.active { color: #e8d5b5; background-color: #242424; }
.ribbon .rb-rule { color: #c8b89a; }                      /* the open folder's edge */
.ribbon .rb-fill { flex: 1; overflow: hidden; }   /* underscores run to the end */
.ribbon .rb-tools {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0 0 0;            /* flush left: the opening bar is the folder's left edge */
}
.ribbon .rb-hint { font-size: 9px; color: #3a3a3a; letter-spacing: 1px; }
.ribbon .rb-hint.nag { color: #b8753a; }
.ribbon .rb-sep { color: #333; user-select: none; margin: 0 6px; }
.ribbon .rb-tools > .rb-sep:first-child { margin-left: 0; }
.ribbon .tool {
  font-size: 11px; color: #7a8ab8; cursor: pointer; user-select: none;
  letter-spacing: 0; white-space: nowrap;
}
.ribbon .tool:hover { color: #e8d5b5; }
.ribbon .tool.on { color: #8f9f6b; }
.ribbon .tool.danger { color: #6b4a28; }
.ribbon .tool.danger:hover { color: #b8753a; }
.ribbon .tool.danger.armed { color: #e09a4a; }
.ribbon .rb-time, .transport .rb-time {
  margin-left: auto; font-size: 10px; color: #555; letter-spacing: 1px;
}
/* transport belongs with the player, not with the notes tools */
.transport { display: flex; align-items: center; gap: 14px; margin-top: 6px; max-width: 420px; }
.transport .tool {
  font-size: 11px; color: #7a8ab8; cursor: pointer; user-select: none; white-space: nowrap;
}
.transport .tool:hover { color: #e8d5b5; }
.transport .tool.on { color: #8f9f6b; }
/* chord rows: each line of words gets its own row above it to put chords on.
   not another line of text — a lane, which is why the words are read-only here
   and you go back to the plain box to change them. */
#notes-lanes {
  width: 100%; margin-top: 0; height: 150px; overflow: auto;
  background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 2px;
  padding: 10px 12px;
}

/* circle of fifths: takes the right-hand side of the writing area, slides in
   and out rather than appearing, and is clipped by #notes-area so the shadow
   only ever darkens the notes */
#fifths {
  position: absolute; top: 0; right: 0; bottom: 0; width: 660px; max-width: 72%;
  background: #000; border: 1px solid #2e2e2e; border-radius: 2px;
  box-shadow: 0 0 30px 10px rgba(0, 0, 0, 0.92);
  display: flex; align-items: flex-start; justify-content: center;
  overflow: hidden;               /* squeeze it and the wheel is cropped, never spilled */
  padding-top: 22px;              /* sits up top; the room below is for what comes next */
  transform: translateX(110%); transition: transform .22s ease-out;
  pointer-events: none;
}
#fifths.open { transform: translateX(0); pointer-events: auto; }
#fifths .wheel {
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.45;
  color: #c8b89a; white-space: pre; margin: 0;          /* majors; pre = never wraps */
  flex: 0 0 auto;                 /* and never squashed into wrapping either */
}
#fifths .wheel .maj { color: #c8b89a; }                 /* majors */
#fifths .wheel .min { color: #7a8ab8; }                 /* relative minors */
#fifths .wheel .pos { color: #8f9f6b; }                 /* scale degrees */
/* the chords only become pickable when there is a chord row to put one in */
#fifths.armed .wheel .maj, #fifths.armed .wheel .min {
  cursor: pointer; position: relative;
}
/* a name is one or two characters — about 16px of target. the pseudo-element
   widens what you can hit without moving a single character off the grid,
   since it is positioned rather than laid out. */
#fifths.armed .wheel .maj::before, #fifths.armed .wheel .min::before {
  content: ''; position: absolute; inset: -5px -7px;   /* catches the click only */
}
/* the highlight grows by spread rather than padding — same reason: a padded
   span would push its neighbours off the character grid */
#fifths.armed .wheel .maj:hover, #fifths.armed .wheel .min:hover {
  color: #fff; background-color: #2e3346; border-radius: 2px;
  box-shadow: 0 0 0 4px #2e3346;
}
.lane { margin-bottom: 4px; }
/* the chord row is a grid, not a text field. a chord sits at a character
   column, which is exactly how a chord sheet has always worked — so dragging
   one left or right is just changing how many spaces precede it in the file. */
/* the row keeps the lyric's font so its character grid is the lyric's grid,
   even though the chips sitting on it are bigger */
.lane .chord-row {
  position: relative; height: 24px; cursor: text;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.7;
  background-color: #242424; border-radius: 2px;   /* the whole row, not the chords */
}
.lane .chord-chip {
  position: absolute; top: 50%; transform: translateY(-50%);
  cursor: grab; user-select: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px; line-height: 1.2;      /* 1.25x the words */
  color: #a8bade; background: transparent; border-radius: 2px;
  padding: 0 3px; margin-left: -3px; white-space: pre; outline: none;
}
.lane .chord-chip:hover { background-color: #333; color: #c6d4f0; }
.lane .chord-chip:focus { background-color: #3a3a3a; color: #e8f0ff; cursor: text; }
.lane .chord-chip.dragging { cursor: grabbing; background-color: #44476a; color: #fff; z-index: 2; }
/* not a chord yet — it will revert rather than be written out as one */
.lane .chord-chip.bad { background-color: #4a2525; color: #e4b4b4; }
/* the row the wheel will drop a chord into */
.lane .chord-row.aimed { background-color: #2e2e2e; box-shadow: inset 2px 0 0 #8f9f6b; }
.lane .lane-lyric {
  color: #e8d5b5; font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
.hunk .title, .active-box .title { color: #e8d5b5; font-size: 12px; letter-spacing: 1px; }
.hunk .title.none, .active-box .title.none { color: #3a3a3a; font-style: italic; letter-spacing: 0; }
.hunk .date.pick { cursor: pointer; }
.hunk .date.pick:hover { color: #e8d5b5; border-bottom: 1px dotted #7a8ab8; }
</style>
</head>
<body>
<div class="header horz_sep_major">
  <h1>Compost</h1>
  <span class="stats" id="stats"></span>
  <span class="random" onclick="randomPost()">random</span>
  <span class="classes-toggle" onclick="toggleClasses()">classes</span>
</div>
<div id="classes-panel" class="horz_sep_minor">
  <div class="note">edits fall forward — the clerk files future memos by these; already-filed hunks keep their label</div>
  <div id="class-rows"></div>
</div>
<div id="active" class="horz_sep_major"></div>
<div class="searchbar horz_sep_minor">
  <input id="q" type="search" placeholder="search the pile…" autofocus autocomplete="off">
  <div id="filters">
    <div id="class-chips"></div>
    <div id="mark-filter">
      <span class="chip mark-chip" id="mark-chip" onclick="toggleMarkFilter()"
            title="only hunks flagged as having something in them">something here</span>
    </div>
    <div id="archive-filter">
      <span class="chip archive-chip" id="archive-chip" onclick="toggleArchivedFilter()"
            title="the hunks you put out of view — nothing was deleted">archived</span>
    </div>
  </div>
</div>
<div id="results"></div>
<script>
const q = document.getElementById('q');
const results = document.getElementById('results');
const stats = document.getElementById('stats');
let timer = null;

function fmtDate(iso) {
  return iso ? iso.slice(0, 16).replace('T', ' · ') : '?';
}
function fmtDur(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return m ? `${m}m${String(sec).padStart(2,'0')}s` : `${sec}s`;
}

function hunkHTML(e) {
  return `
    <div class="hunk horz_sep_minor">
      <div class="meta-row">
        <span class="date pick" onclick="setActive('${e.id}')"
              title="make this the active post">${fmtDate(e.created_at)}</span>
        ${e.title ? `<span class="title">${esc(e.title)}</span>` : ''}
        <span class="cls">${e.class}</span>
        ${(e.tags || '').split(',').filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('')}
        <span class="dur">${fmtDur(e.duration)}</span>
        <span class="ctrls">${markHTML(e)}${delHTML(e)}</span>
      </div>
      <div class="snip">${e.snip || '<span style="color:#444">(no transcript)</span>'}</div>
      <audio controls preload="none" src="/audio/${encodeURIComponent(e.audio_path.replace(/^audio\//,''))}"></audio>
    </div>`;
}

let statsData = null;
function setStats(data) {
  statsData = data;
  stats.textContent = `${data.total} hunks · ${(data.oldest||'').slice(0,4)}–${(data.newest||'').slice(0,4)}`;
}

const expanded = new Set();       // survives search-and-clear
const yearCache = new Map();      // "year|filter" -> hunks, fetched once
const activeCls = new Set();      // class filter; empty = no filter
let markOn = false;               // the other axis, filtered on its own
let archiveOn = false;             // showing the archived pile instead of the live one
const chipRow = document.getElementById('class-chips');
const markChip = document.getElementById('mark-chip');
const archiveChip = document.getElementById('archive-chip');

const clsParam = () => [...activeCls].join(',');
const filterParams = () =>
  `cls=${clsParam()}&mark=${markOn ? 1 : 0}&archived=${archiveOn ? 1 : 0}`;
const cacheKey = year => `${year}|${clsParam()}|${markOn ? 1 : 0}|${archiveOn ? 1 : 0}`;

function markHTML(e) {
  const on = e.status === 'promoted';
  return `<span class="mark${on ? ' on' : ''}" data-id="${e.id}"
                onclick="toggleMark('${e.id}', event)"
                title="${on ? 'there is something here' : 'flag: something here'}"
          >${on ? '[&bull;]' : '[&nbsp;]'}</span>`;
}

async function toggleMark(id, ev) {
  ev.stopPropagation();
  const on = ev.currentTarget.classList.contains('on');
  const r = await fetch('/api/mark', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, mark: !on})
  });
  if (!r.ok) { alert(await r.text()); return; }
  applyMark(id, (await r.json()).status === 'promoted');
}

// patch in place rather than re-render: a re-render would restart the audio,
// and an unmarked row shouldn't vanish out from under the cursor
function applyMark(id, on) {
  document.querySelectorAll(`.mark[data-id="${id}"]`).forEach(el => {
    el.classList.toggle('on', on);
    el.innerHTML = on ? '[&bull;]' : '[&nbsp;]';
    el.title = on ? 'there is something here' : 'flag: something here';
  });
  const st = on ? 'promoted' : 'raw';
  yearCache.forEach(list => list.forEach(e => { if (e.id === id) e.status = st; }));
  document.querySelectorAll(`[data-status-for="${id}"]`).forEach(el => el.textContent = st);
  if (activeHunk && activeHunk.id === id) activeHunk.status = st;
}

const DEL_TITLE = 'put out of view — nothing is deleted, find it again under "archived"';
const BACK_TITLE = 'put this back in the pile';

function delHTML(e) {
  const hid = !!e.archived;
  return `<span class="del${hid ? ' back' : ''}" data-del="${e.id}"
                onclick="archiveHunk('${e.id}', ${!hid}, event)"
                title="${hid ? BACK_TITLE : DEL_TITLE}"
          >${hid ? '[back]' : '[archive]'}</span>`;
}

// one click, both directions. this used to ask twice, from when [x] meant
// delete — but archiving moves nothing and the archived chip puts it back in a
// tap, so a confirm step was just ceremony in front of a reversible act.
async function archiveHunk(id, archive, ev) {
  ev.stopPropagation();
  const r = await fetch('/api/archive', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, archive})
  });
  if (!r.ok) { alert(await r.text()); return; }
  dropHunk(id);   // it left whichever view you are in — the live one or the archived one
}

function dropHunk(id) {
  yearCache.forEach((list, key) =>
    yearCache.set(key, list.filter(e => e.id !== id)));
  if (activeHunk && activeHunk.id === id) renderActive(null);
  document.querySelectorAll(`[data-del="${id}"]`).forEach(d => {
    const row = d.closest('.hunk');
    if (!row) return;
    bumpCount(row.closest('.year-body'), -1);   // the year it was filed under
    row.remove();
  });
  if (statsData) { statsData.total--; setStats(statsData); }
}

// a deleted hunk stops being counted immediately — waiting for the next
// fetch leaves the page insisting on a number it can no longer show
function bumpCount(yearBody, by) {
  const el = yearBody && yearBody.previousElementSibling.querySelector('.count');
  if (!el) return;   // search results have no year headers
  el.textContent = el.textContent.replace(/\d+/, n => Math.max(0, +n + by));
}

function toggleMarkFilter() {
  markOn = !markOn;
  markChip.classList.toggle('active', markOn);
  search();
}

function toggleArchivedFilter() {
  archiveOn = !archiveOn;
  archiveChip.classList.toggle('active', archiveOn);
  expanded.clear();   // the two piles share no years; stale folds would mislead
  search();
}

function renderChips(classes) {
  chipRow.innerHTML = classes.map(c =>
    `<span class="chip${activeCls.has(c) ? ' active' : ''}" onclick="toggleCls('${c}')">${c}</span>`
  ).join('');
}

function toggleCls(c) {
  activeCls.has(c) ? activeCls.delete(c) : activeCls.add(c);
  [...chipRow.children].forEach(el =>
    el.classList.toggle('active', activeCls.has(el.textContent)));
  search();  // re-run whichever view is up, filtered
}

async function search() {
  if (!q.value.trim()) return showYears();
  const r = await fetch(`/api/search?q=${encodeURIComponent(q.value)}&${filterParams()}`);
  const data = await r.json();
  if (!q.value.trim()) return;    // box was cleared while fetching
  setStats(data);
  results.innerHTML = data.results.length
    ? data.results.map(hunkHTML).join('')
    : '<div class="empty">nothing in the pile matches</div>';
}

async function showYears() {
  const r = await fetch('/api/search?' + filterParams());
  const data = await r.json();
  if (q.value.trim()) return;     // user started typing while fetching
  setStats(data);
  renderChips(data.classes);
  results.innerHTML = data.years.map(y => `
    <div class="year">
      <div class="year-header horz_sep_major" onclick="toggleYear('${y.year}')">
        <span class="arrow">&#9656;</span>${y.year} <span class="count">· ${y.count} hunks</span>
      </div>
      <div class="year-body" id="yr-${y.year}"></div>
    </div>`).join('');
  expanded.forEach(renderYear);   // restore fold state after a cleared search
}

async function renderYear(year) {
  const body = document.getElementById('yr-' + year);
  if (!body) return;
  body.previousElementSibling.querySelector('.arrow').innerHTML = '&#9662;';
  const key = cacheKey(year);
  if (!yearCache.has(key)) {
    body.innerHTML = '<div class="loading">digging…</div>';
    const r = await fetch(`/api/search?year=${year}&${filterParams()}`);
    yearCache.set(key, (await r.json()).results);
  }
  if (!expanded.has(year)) return;  // collapsed again while fetching
  body.innerHTML = yearCache.get(key).map(hunkHTML).join('');
}

function toggleYear(year) {
  const body = document.getElementById('yr-' + year);
  if (expanded.has(year)) {
    expanded.delete(year);
    body.innerHTML = '';
    body.previousElementSibling.querySelector('.arrow').innerHTML = '&#9656;';
  } else {
    expanded.add(year);
    renderYear(year);
  }
}

// ---- class roster CRUD (edits fall forward only) ----
const panel = document.getElementById('classes-panel');
const classRows = document.getElementById('class-rows');

function toggleClasses() {
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) loadClasses();
}

async function loadClasses() {
  const classes = await (await fetch('/api/classes')).json();
  classRows.innerHTML = Object.hunks(classes).map(([name, writeup]) => `
    <div class="class-row">
      <span class="cname">${name}</span>
      <textarea id="cw-${name}">${writeup.replace(/</g, '&lt;')}</textarea>
      <button onclick="saveClass('${name}')">save</button>
      ${name === 'compost' ? '' : `<button class="retire" onclick="retireClass('${name}')">retire</button>`}
    </div>`).join('') + `
    <div class="class-row">
      <input class="cname-input" id="new-cname" placeholder="new class" autocomplete="off">
      <textarea id="new-cwriteup" placeholder="write-up the clerk will file by…"></textarea>
      <button onclick="addClass()">add</button>
    </div>`;
}

async function postClass(name, writeup) {
  const r = await fetch('/api/classes', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, writeup})
  });
  if (!r.ok) { alert(await r.text()); return false; }
  return true;
}
async function saveClass(name) {
  if (await postClass(name, document.getElementById('cw-' + name).value)) loadClasses();
}
async function addClass() {
  const name = document.getElementById('new-cname').value.trim();
  const writeup = document.getElementById('new-cwriteup').value.trim();
  if (name && writeup && await postClass(name, writeup)) loadClasses();
}
async function retireClass(name) {
  const r = await fetch('/api/classes/' + encodeURIComponent(name), {method: 'DELETE'});
  if (!r.ok) alert(await r.text());
  loadClasses();
}

// one voice at a time: starting any player pauses the rest
document.addEventListener('play', ev => {
  document.querySelectorAll('audio').forEach(a => { if (a !== ev.target) a.pause(); });
}, true);

// ---- active post: survives searches and reloads until cleared ----
const activeWrap = document.getElementById('active');
let activeHunk = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nfmt = n => n.toLocaleString();
const words = t => { const x = (t || '').trim(); return x ? x.split(/\s+/).length : 0; };

function deetRows(e) {
  const rows = [
    ['id', esc(e.id)],
    ['source', esc(e.source)],
    ['status', `<span data-status-for="${esc(e.id)}">${esc(e.status)}</span>`],
    ['indexed', esc(fmtDate(e.indexed_at))],
    ['length', `${nfmt(words(e.transcript))} words · ${nfmt((e.transcript || '').length)} chars`],
    ['file', `<span class="pathlink" onclick="revealActive()"
                    title="reveal in Finder">${esc(e.audio_path)}</span>`],
  ];
  // schema carries location but nothing has ever filled it — show only if it does
  const place = e.place || (e.lat != null && e.lon != null ? `${e.lat}, ${e.lon}` : '');
  if (place) rows.push(['place', esc(place)]);
  return rows.map(([k, v]) => `<span class="k">${k}</span><span class="v">${v}</span>`).join('');
}

function renderActive(e) {
  flushNotes();        // the box is about to be replaced — don't let a pending save die with it
  activeWrap.classList.remove('big');
  activeHunk = e;
  notesSaved = e ? (e.notes || '') : null;
  if (!e) {
    activeWrap.classList.remove('open');
    activeWrap.innerHTML = '';
    localStorage.removeItem('compost.active');
    return;
  }
  localStorage.setItem('compost.active', e.id);
  activeWrap.innerHTML = `
    <div class="active-box">
      <div class="top">
        <span class="label">active hunk</span>
        ${markHTML(e)}${delHTML(e)}
        <span class="date">${fmtDate(e.created_at)}</span>
        ${e.title ? `<span class="title">${esc(e.title)}</span>`
                  : '<span class="title none">unnamed</span>'}
        <span class="cls">${esc(e.class)}</span>
        ${(e.tags || '').split(',').filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
        <span class="dur">${fmtDur(e.duration)}</span>
        <span class="act glyph" onclick="toggleBig()" id="big-btn"
              title="fill the screen — more room to write">[&lt;-&gt;]</span>
        <span class="act glyph close" onclick="renderActive(null)"
              title="put the active hunk away">[x]</span>
      </div>
      <div class="deets">${deetRows(e)}</div>
      <audio controls preload="none"
             src="/audio/${encodeURIComponent(e.audio_path.replace(/^audio\//, ''))}"></audio>
      <div class="transport">
        <span class="tool" id="rb-play" onclick="rbPlay()" title="play from where you left off">[play]</span>
        <span class="tool" onclick="rbSeek(-5)" title="back five seconds">[-5s]</span>
        <span class="tool" id="rb-loop" onclick="rbLoop()" title="keep it going round">[loop]</span>
        <span class="tool" id="rb-rate" onclick="rbRate()" title="slow it down to catch the words">[1x]</span>
        <span class="rb-time" id="rb-time">0:00</span>
      </div>
      <div class="full horz_sep_minor on_top">${esc(e.transcript) || '<span style="color:#444">(no transcript)</span>'}</div>
      <div class="notes-head horz_sep_minor on_top">
        <span class="lbl">notes</span>
        <span class="count" id="notes-count"></span>
        <span class="state" id="notes-state"></span>
      </div>
      <div id="notes-area">
        <textarea class="notes" id="notes-box" spellcheck="true" maxlength="${MAX_NOTES}"
                  placeholder="work it out here…">${esc(e.notes || '')}</textarea>
        <div id="notes-lanes" hidden></div>
        <aside id="fifths"><pre class="wheel">${buildFifths()}</pre></aside>
      </div>
      <div class="ribbon">
        <div class="rb-tabs" id="rb-tabs"></div>
        <div class="rb-tools" id="rb-tools"></div>
      </div>
    </div>`;
  rbRateIdx = 0;                       // a new hunk starts at full speed
  wireRibbon(activeWrap.querySelector('audio'));
  chordRowsOn = false;                 // and in the plain box, writing words
  fifthsOn = false;                    // and with the wheel put away
  paintChordRows();
  paintFifths();
  paintRibbon();
  const box = document.getElementById('notes-box');
  showCount(box.value.length);
  box.addEventListener('input', () => {
    showCount(box.value.length);
    notesState('');
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => saveNotes(e.id, box.value), 800);
  });
  box.addEventListener('blur', () => {
    clearTimeout(notesTimer);
    saveNotes(e.id, box.value);
  });
  activeWrap.classList.add('open');
}

// notes save themselves: a note you have to remember to save is a note you
// lose. debounced while typing, flushed the moment focus leaves.
const MAX_NOTES = 10000;   // keep in step with MAX_NOTES in server.py
let notesTimer = null, notesSaved = null;

function notesState(cls, text) {
  const el = document.getElementById('notes-state');
  if (!el) return;
  el.className = 'state ' + cls;
  el.textContent = text || '';
}

function showCount(n) {
  const el = document.getElementById('notes-count');
  if (!el) return;
  el.className = 'count' + (n >= MAX_NOTES ? ' full' : n > MAX_NOTES * 0.9 ? ' near' : '');
  el.textContent = `${n}/${MAX_NOTES} chars`;
}

// anything that destroys the textarea has to flush first. removing a focused
// element does not reliably fire blur, so the debounce alone would drop the
// last thing typed before clearing or switching the active post.
function flushNotes() {
  clearTimeout(notesTimer);
  const box = document.getElementById('notes-box');
  if (box && activeHunk) saveNotes(activeHunk.id, box.value);
}

async function saveNotes(id, text) {
  if (text === notesSaved) return;        // nothing changed since the last write
  notesState('saving', 'saving…');
  try {
    const r = await fetch('/api/notes', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id, text})
    });
    if (!r.ok) throw new Error(await r.text());
    const e = await r.json();
    notesSaved = text;
    if (activeHunk && activeHunk.id === id) activeHunk.notes = e.notes;
    notesState('saved', 'saved ' + new Date().toTimeString().slice(0, 5));
  } catch (err) {
    notesState('failed', 'not saved');
  }
}

// ---- chord rows ----
// A chord row is a line that is nothing but chords: every token has to parse,
// so "G7 Am C" is one and "Go to the chorus" is not. Deliberately strict —
// swallowing a lyric line because it opened with the word "A" would be worse
// than leaving a chord row showing.
const CHORD = /^[A-G][#b]?(maj|min|m|dim|aug|sus|add|M)?\d*(sus\d?|add\d+)?(\/[A-G][#b]?)?$/;
// the rest of the chord-sheet vocabulary: bar lines, repeats, counts, and the
// handful of words that legitimately sit in a chord row
const CHORD_EXTRA =
  /^(\||\|\||:\||\|:|%|-|N\.?C\.?|x\d+|\d+x|riff|solo|intro|outro|vamp|break|tacet|rest)$/i;

const isChordRow = line => {
  const t = line.trim().split(/\s+/).filter(Boolean);
  return t.length > 0 && t.every(x => CHORD.test(x) || CHORD_EXTRA.test(x));
};

// The file keeps the classic chord-sheet shape — a chord line sitting above
// the line it belongs to — so what is on disk is still plain text anyone can
// read. These two turn that text into pairs and back.
function parseLanes(text) {
  const out = [];
  let pending = null;
  for (const line of text.split('\n')) {
    if (isChordRow(line)) { pending = line; continue; }
    out.push({ chord: pending, lyric: line });
    pending = null;
  }
  if (pending !== null) out.push({ chord: pending, lyric: '' });
  return out;
}

const stripChordRows = text =>
  text.split('\n').filter(l => !isChordRow(l)).join('\n');

function serializeLanes(lanes) {
  const out = [];
  for (const l of lanes) {
    if (l.chord && l.chord.trim()) out.push(l.chord);
    out.push(l.lyric);
  }
  return out.join('\n');
}

// takes out the chord rows and nothing else — the words are never at risk.
// still two taps, because a worked-out set of chords is real work.
let clearArmed = null;
function clearChordRows() {
  const btn = document.getElementById('rb-clear');
  const box = document.getElementById('notes-box');
  if (!btn || !box) return;
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed');
    btn.textContent = '[sure?]';
    clearArmed = setTimeout(() => {
      btn.classList.remove('armed');
      btn.textContent = '[clear]';
    }, 4000);
    return;
  }
  clearTimeout(clearArmed);
  btn.classList.remove('armed');
  btn.textContent = '[clear]';
  box.value = stripChordRows(box.value);
  showCount(box.value.length);
  clearTimeout(notesTimer);
  saveNotes(activeHunk.id, box.value);
  paintChordRows();
}

// ---- circle of fifths ----
// Three rings on a twelve-step clock, C at the top, a fifth clockwise each
// step: the degree outside, the major, and its relative minor within.
// Generated rather than drawn, so a radius is a number and not 29 lines of
// hand-counted spaces.
const FIFTH_MAJ = ['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'];
const FIFTH_MIN = ['Am','Em','Bm','F#m','C#m','G#m','D#m','Bbm','Fm','Cm','Gm','Dm'];
const FIFTH_POS = ['I','V','II','VI','III','VII','#IV','bII','bVI','bIII','bVII','IV'];

// ±5.5 has to land on ±6, or the top and bottom halves stop mirroring and the
// wheel looks subtly buckled for reasons nobody can point at
const halfAway = v => (v >= 0 ? Math.floor(v + 0.5) : -Math.floor(-v + 0.5));

function buildFifths() {
  const W = 84, H = 35, cx = 41, cy = 16;
  const ch = Array.from({ length: H }, () => Array(W).fill(' '));
  const kind = Array.from({ length: H }, () => Array(W).fill(''));
  const ring = (items, RX, RY, k) => items.forEach((t, i) => {
    const th = i * 30 * Math.PI / 180;
    const sn = +Math.sin(th).toFixed(6), cs = +Math.cos(th).toFixed(6);
    const row = cy - halfAway(RY * cs);
    let col = cx + halfAway(RX * sn) - Math.floor(t.length / 2);
    col = Math.max(0, Math.min(W - t.length, col));
    for (let n = 0; n < t.length; n++) { ch[row][col + n] = t[n]; kind[row][col + n] = k; }
  });
  ring(FIFTH_POS, 38, 14, 'pos');
  ring(FIFTH_MAJ, 31, 11, 'maj');
  ring(FIFTH_MIN, 17, 6, 'min');

  let rows = ch.map((r, y) => {
    let out = '', run = '', runKind = null;
    const flush = () => {
      if (!run) return;
      out += runKind ? `<span class="${runKind}">${esc(run)}</span>` : esc(run);
      run = '';
    };
    for (let x = 0; x < W; x++) {
      if (kind[y][x] !== runKind) { flush(); runKind = kind[y][x]; }
      run += r[x];
    }
    flush();
    return { html: out.replace(/\s+$/, ''), blank: r.join('').trim() === '' };
  });
  while (rows.length && rows[0].blank) rows.shift();
  while (rows.length && rows[rows.length - 1].blank) rows.pop();
  return rows.map(r => r.html).join('\n');
}

let fifthsOn = false;

function toggleFifths() {
  fifthsOn = !fifthsOn;
  // the wheel needs the room; opening it from the small view opens that too
  if (fifthsOn && !activeWrap.classList.contains('big')) toggleBig(true);
  paintFifths();
  paintRibbon();
}

function paintFifths() {
  const panel = document.getElementById('fifths');
  if (!panel) return;
  panel.classList.toggle('open', fifthsOn);
  const wheel = panel.querySelector('.wheel');
  if (wheel && !wheel.dataset.wired) {
    wheel.dataset.wired = '1';
    wheel.addEventListener('mousedown', ev => {
      // mousedown, not click: by click time the chip has already blurred
      const hit = ev.target.closest('.maj, .min');
      if (!hit) {
        if (chordRowsOn) fileSays('click the chord itself', true);
        return;
      }
      ev.preventDefault();                 // keep the cursor where it is
      placeFromWheel(hit.textContent.trim());
    });
  }
  // only live when a chord row is open to receive one
  panel.classList.toggle('armed', fifthsOn && chordRowsOn);
}

// ---- the ribbon: tabs of tools ----
const TABS = [
  { id: 'songs', label: 'songs' },
  { id: 'text',  label: 'text'  },
  { id: 'file',  label: 'file'  },
];
let activeTab = 'songs';

const TAB_TOOLS = {
  songs: () => `
    <span class="tool-label">chord rows</span>
    <span class="tool" id="rb-chord-rows" onclick="toggleChordRows()"
          title="a chord row above every return">${chordRowsOn ? '[hide]' : '[show]'}</span>
    <span class="tool danger" id="rb-clear" onclick="clearChordRows()"
          title="take out every chord row — the words are left alone">[clear]</span>
    <span class="rb-sep">|</span>
    <span class="tool-label">circle of 5ths</span>
    <span class="tool" id="rb-fifths" onclick="toggleFifths()"
          title="the wheel, down the right of the sheet">${fifthsOn ? '[close]' : '[open]'}</span>
    <span class="rb-sep">|</span>
    <span class="rb-hint" id="rb-hint">${fifthsOn && chordRowsOn
      ? 'click a chord row, then pick off the wheel' : ''}</span>`,
  text: () => `
    <span class="tool" onclick="wrapSelection('**')" title="**bold** the selected words">[bold]</span>
    <span class="tool" onclick="wrapSelection('*')" title="*italic* the selected words">[italic]</span>
    <span class="rb-sep">|</span>
    <span class="rb-hint" id="rb-hint">select some words first</span>`,
  file: () => `
    <span class="tool" onclick="openAsPdf()" title="a printable sheet — save as pdf from the dialog">[open as pdf]</span>
    <span class="tool" onclick="copyAsMarkdown()" title="the notes, as markdown, on the clipboard">[copy as markdown]</span>
    <span class="tool" onclick="revealActive()" title="show the recording in Finder">[reveal in finder]</span>
    <span class="rb-sep">|</span>
    <span class="rb-hint" id="rb-hint"></span>`,
};

// ---- file tools ----
const hunkName = h => (h && h.title && h.title.trim()) || fmtDate(h && h.created_at);

function fileSays(msg, bad) {
  const hint = document.getElementById('rb-hint');
  if (!hint) return;
  hint.textContent = msg;
  hint.classList.toggle('nag', !!bad);
  setTimeout(() => { hint.textContent = ''; hint.classList.remove('nag'); }, 2500);
}

// the notes are already a monospace chord sheet, so printing is a matter of
// not getting in the way: same face, same spaces, stanzas kept whole
function printableDoc(name, when, notes) {
  const stanzas = notes.replace(/\s+$/, '').split(/\n{2,}/)
    .map(b => `<div class="stanza">${esc(b)}</div>`).join('');
  return `<!doctype html><html><head><meta charset="utf-8">
<title>${esc(name)}</title>
<style>
  @page { margin: 18mm; }
  body { background: #fff; color: #111; font-family: 'IBM Plex Mono', ui-monospace, monospace;
         font-size: 11pt; line-height: 1.55; margin: 0; }
  h1 { font-size: 15pt; font-weight: 700; margin: 0; letter-spacing: 1px; }
  .when { font-size: 9pt; color: #555; margin-top: 2px; }
  hr { border: 0; border-top: 1px solid #bbb; margin: 10px 0 16px; }
  .stanza { white-space: pre; break-inside: avoid; page-break-inside: avoid; margin-bottom: 14px; }
  @media print { .stanza { white-space: pre-wrap; } }
</style></head><body>
<h1>${esc(name)}</h1><div class="when">${esc(when)}</div><hr>
${stanzas}
<script>window.onload = function () { window.print(); };<\/script>
</body></html>`;
}

function openAsPdf() {
  const box = document.getElementById('notes-box');
  if (!activeHunk || !box || !box.value.trim()) { fileSays('nothing written yet', true); return; }
  flushNotes();
  const w = window.open('', '_blank');
  if (!w) { fileSays('the browser blocked the window', true); return; }
  w.document.write(printableDoc(hunkName(activeHunk), fmtDate(activeHunk.created_at), box.value));
  w.document.close();           // the written page prints itself on load
}

async function copyAsMarkdown() {
  const box = document.getElementById('notes-box');
  if (!activeHunk || !box || !box.value.trim()) { fileSays('nothing written yet', true); return; }
  flushNotes();
  const md = `# ${hunkName(activeHunk)}\n\n${fmtDate(activeHunk.created_at)}\n\n${box.value.trimEnd()}\n`;
  try {
    await navigator.clipboard.writeText(md);
    fileSays(`copied ${md.length} chars`);
  } catch (err) {
    fileSays('clipboard refused', true);
  }
}

function paintRibbon() {
  const tabs = document.getElementById('rb-tabs');
  const tools = document.getElementById('rb-tools');
  if (!tabs || !tools) return;
  // the rule is the open folder's top edge, so it is lit like the active tab
  // and runs unbroken; only the tabs that are shut are dimmed
  const parts = [];
  TABS.forEach((t, i) => {
    if (i > 0) parts.push('<span class="rb-rule">__</span>');
    parts.push(`<span class="rb-tab${t.id === activeTab ? ' active' : ''}"
                      onclick="selectTab('${t.id}')">/${t.label}\\</span>`);
  });
  parts.push(`<span class="rb-rule rb-fill">${'_'.repeat(300)}</span>`);
  tabs.innerHTML = parts.join('');
  // a bar opens the row as well as closing each group, so the tools read as
  // sitting between dividers rather than trailing off the left edge
  tools.innerHTML = '<span class="rb-sep">|</span>' + TAB_TOOLS[activeTab]();
}

function selectTab(id) {
  activeTab = id;
  // the text tools work on the box, so they need the box rather than the lanes
  if (id === 'text' && chordRowsOn) {
    chordRowsOn = false; chordPoint = null;
    paintChordRows(); paintFifths();     // the wheel must stop looking armed too
  }
  paintRibbon();
}

// notes are .md on disk, so bold and italic are the markdown they already are.
// wrapping twice unwraps, so the buttons toggle rather than pile markers up.
function wrapSelection(marker) {
  const box = document.getElementById('notes-box');
  const hint = document.getElementById('rb-hint');
  if (!box || box.hidden) return;
  const a = box.selectionStart, b = box.selectionEnd, v = box.value;
  if (a === b) {
    if (hint) { hint.classList.add('nag'); setTimeout(() => hint.classList.remove('nag'), 1200); }
    box.focus();
    return;
  }
  const n = marker.length;
  const already = v.slice(a - n, a) === marker && v.slice(b, b + n) === marker;
  box.value = already
    ? v.slice(0, a - n) + v.slice(a, b) + v.slice(b + n)
    : v.slice(0, a) + marker + v.slice(a, b) + marker + v.slice(b);
  box.focus();
  const shift = already ? -n : n;
  box.setSelectionRange(a + shift, b + shift);
  box.dispatchEvent(new Event('input'));
}

// the lanes on screen, held rather than re-derived: re-parsing the text on
// every keystroke meant one bad line renumbered everything and the chords
// jumped to the wrong words
let laneRows = [];

// Where a chord picked off the wheel will land: which chord row, and which
// character column in it. Set by putting the cursor in a row, which is the
// same gesture you would use to type one by hand.
let chordPoint = null;

function aimAt(row, col) {
  chordPoint = { i: +row.dataset.i, col: Math.max(0, col) };
  showAim();
}

function showAim() {
  document.querySelectorAll('#notes-lanes .chord-row').forEach(r =>
    r.classList.toggle('aimed', chordPoint !== null && +r.dataset.i === chordPoint.i));
}

// clicking a name on the wheel drops it where the cursor was, then steps past
// it, so a progression can be clicked out left to right without re-aiming
function placeFromWheel(name) {
  if (!chordRowsOn || !fifthsOn) return;
  if (!chordPoint) { fileSays('put the cursor in a chord row first', true); return; }
  const row = document.querySelector(`#notes-lanes .chord-row[data-i="${chordPoint.i}"]`);
  if (!row) { chordPoint = null; return; }
  // clicking an empty part of the row leaves an empty chip waiting for typing;
  // picking off the wheel instead means it was never going to be filled
  row.querySelectorAll('.chord-chip').forEach(c => {
    if (!c.textContent.trim()) c.remove();
  });
  const chip = newChip(chordPoint.col, row);
  chip.textContent = name;
  row.appendChild(chip);
  commitLanes();
  chordPoint.col += name.length + 1;
}
let chordRowsOn = false;

function toggleChordRows() {
  chordRowsOn = !chordRowsOn;
  if (!chordRowsOn) chordPoint = null;
  paintChordRows();
  paintFifths();
  paintRibbon();
}

function paintChordRows() {
  const box = document.getElementById('notes-box');
  const lanes = document.getElementById('notes-lanes');
  const btn = document.getElementById('rb-chord-rows');
  if (!box || !lanes) return;
  btn?.classList.toggle('on', chordRowsOn);
  if (btn) btn.title = chordRowsOn ? 'put the chord rows away'
                                   : 'open a chord row above every line';
  if (!chordRowsOn) {
    lanes.hidden = true;
    box.hidden = false;
    return;
  }
  flushNotes();                        // never strand unsaved words behind a view switch
  const rows = laneRows = parseLanes(box.value);
  // every return gets a row, blank lines included — a rest or an instrumental
  // gap is exactly where you want somewhere to put a chord
  lanes.innerHTML = rows.map((r, i) =>
    `<div class="lane">
       <div class="chord-row" data-i="${i}">${chipsHTML(r.chord || '')}</div>
       <div class="lane-lyric">${esc(r.lyric) || '&nbsp;'}</div>
     </div>`).join('') || '<div class="lane-lyric" style="color:#444">nothing written yet</div>';
  lanes.querySelectorAll('.chord-row').forEach(row => { wireChordRow(row); placeChips(row); });
  showAim();
  box.hidden = true;
  lanes.hidden = false;
}

// ---- chord chips ----
// a chord line is a string of spaces with chords dropped into it, so a chip's
// column IS its index in that string. tokens are whatever has a space between
// them, which is also how you string a run of them together for a bridge.
const tokensOf = line => {
  const out = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(line || '')) !== null) out.push({ text: m[0], col: m.index });
  return out;
};

const lineOf = tokens => {
  let line = '';
  for (const t of [...tokens].sort((a, b) => a.col - b.col)) {
    if (!t.text) continue;
    const col = Math.max(t.col, line.length ? line.length + 1 : 0);  // never collide
    line += ' '.repeat(col - line.length) + t.text;
  }
  return line;
};

const chipsHTML = line => tokensOf(line).map(t =>
  `<span class="chord-chip" contenteditable="true" spellcheck="false"
         data-col="${t.col}">${esc(t.text)}</span>`).join('');

const tidyChord = t => {
  const fixed = t.charAt(0).toUpperCase() + t.slice(1);
  return (CHORD.test(fixed) || CHORD_EXTRA.test(fixed)) ? fixed : null;
};

// nothing that cannot read back as a chord row is allowed out of here, so the
// file can never acquire a line that would return as a lyric
const chipsToLine = row => lineOf([...row.querySelectorAll('.chord-chip')]
  .map(c => ({ text: tidyChord(c.textContent.trim()), col: Math.max(0, +c.dataset.col || 0) }))
  .filter(t => t.text));

// left is set in px from the lyric's character width, not in the chip's own ch
function placeChips(row) {
  const chw = chipColWidth(row);
  row.querySelectorAll('.chord-chip').forEach(c => {
    c.style.left = ((+c.dataset.col || 0) * chw) + 'px';
  });
}

function wireChordRow(row) {
  row.addEventListener('mousedown', ev => {
    const chip = ev.target.closest('.chord-chip');
    if (!chip) return;
    const chw = chipColWidth(row);
    const startX = ev.clientX;
    const startCol = +chip.dataset.col || 0;
    let moved = false;
    const move = e => {
      if (Math.abs(e.clientX - startX) < 3 && !moved) return;
      moved = true;
      chip.classList.add('dragging');
      chip.blur();                                  // dragging is not editing
      const col = Math.max(0, Math.round(startCol + (e.clientX - startX) / chw));
      chip.dataset.col = col;
      chip.style.left = (col * chw) + 'px';
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      chip.classList.remove('dragging');
      if (moved) {
        commitLanes();
        paintChordRows();   // redraw from the committed line, so two chords dropped
                            // on top of each other land where the file actually puts them
      } else {
        chip.focus();                               // a click without a drag edits it
        aimAt(row, +chip.dataset.col || 0);
      }
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  // clicking the empty part of the row starts a chord right there
  row.addEventListener('click', ev => {
    if (ev.target !== row) return;
    const chw = chipColWidth(row);
    const col = Math.max(0, Math.round((ev.clientX - row.getBoundingClientRect().left) / chw));
    const chip = newChip(col, row);
    row.appendChild(chip);
    chip.focus();
    aimAt(row, col);
  });

  row.addEventListener('input', ev => {
    const chip = ev.target.closest('.chord-chip');
    if (!chip) return;
    const t = chip.textContent.trim();
    chip.classList.toggle('bad', !(!t || tidyChord(t)));
    commitLanes();                  // tidyChord filters, so only chords get written
  });

  row.addEventListener('keydown', ev => {
    const chip = ev.target.closest('.chord-chip');
    if (!chip) return;
    if (ev.key === 'Enter' || ev.key === 'Escape') { ev.preventDefault(); chip.blur(); return; }
    // space ends this chord and opens the next one a column along, which is
    // what lets you rattle out a whole bridge without reaching for the mouse
    if (ev.key === ' ') {
      ev.preventDefault();
      const text = chip.textContent.trim();
      if (!text) return;
      const col = (+chip.dataset.col || 0) + text.length + 1;
      const next = newChip(col, row);
      row.appendChild(next);
      next.focus();
      commitLanes();
    }
  });

  row.addEventListener('focusout', ev => {
    const chip = ev.target.closest('.chord-chip');
    if (!chip) return;
    if (!chip.textContent.trim()) { chip.remove(); commitLanes(); return; }
    if (/\s/.test(chip.textContent)) splitChip(chip);                     // pasted run
    row.querySelectorAll('.chord-chip').forEach(normalizeChip);
    commitLanes();
  }, true);
}

// A chord row is recognised by what is in it, so anything that is not a chord
// would come back from disk as a lyric line — and every lyric line grows a
// lane of its own, which is how one stray word turns into a stack of empty
// rows. Rather than let that reach the file, a chip that cannot be a chord
// reverts to the last text that could.
function normalizeChip(chip) {
  const raw = chip.textContent.trim();
  if (!raw) { chip.remove(); return; }
  const fixed = raw.charAt(0).toUpperCase() + raw.slice(1);   // "am" -> "Am"
  if (CHORD.test(fixed) || CHORD_EXTRA.test(fixed)) {
    chip.textContent = fixed;
    chip.dataset.good = fixed;
    chip.classList.remove('bad');
    return;
  }
  if (chip.dataset.good) {
    chip.textContent = chip.dataset.good;                     // put back what worked
  } else {
    chip.remove();
  }
}

function newChip(col, row) {
  const chip = document.createElement('span');
  chip.className = 'chord-chip';
  chip.contentEditable = 'true';
  chip.spellcheck = false;
  chip.dataset.col = col;
  chip.style.left = (col * chipColWidth(row)) + 'px';
  return chip;
}

// one chip holding "C F G" is three chords that have not been separated yet
function splitChip(chip) {
  const row = chip.parentElement;
  const startCol = +chip.dataset.col || 0;
  const parts = chip.textContent.trim().split(/\s+/).filter(Boolean);
  chip.textContent = parts[0] || '';
  let col = startCol + (parts[0] || '').length + 1;
  for (const p of parts.slice(1)) {
    const extra = newChip(col, row);
    extra.textContent = p;
    row.appendChild(extra);
    col += p.length + 1;
  }
}

// width of one character in the row's own font, so the grid is honest
function chipColWidth(row) {
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
  probe.textContent = '0'.repeat(20);
  row.appendChild(probe);
  const w = probe.getBoundingClientRect().width / 20;
  probe.remove();
  return w || 7.8;
}

// chords typed into a lane are folded back into the text as a chord line, so
// the lanes are a view of the notes rather than a second place they live
function commitLanes() {
  const box = document.getElementById('notes-box');
  if (!laneRows.length) return;
  document.querySelectorAll('#notes-lanes .chord-row').forEach(row => {
    const r = laneRows[+row.dataset.i];
    if (r) r.chord = chipsToLine(row);
  });
  box.value = serializeLanes(laneRows);
  showCount(box.value.length);
  notesState('');
  clearTimeout(notesTimer);
  notesTimer = setTimeout(() => saveNotes(activeHunk.id, box.value), 800);
}

// ---- transport for the hunk you are writing against ----
const rbAudio = () => document.querySelector('.active-box audio');
const RATES = [1, 0.75, 0.5];
let rbRateIdx = 0;

function rbPlay() {
  const a = rbAudio();
  if (!a) return;
  a.paused ? a.play() : a.pause();
}

function rbSeek(by) {
  const a = rbAudio();
  if (a) a.currentTime = Math.max(0, a.currentTime + by);
}

function rbLoop() {
  const a = rbAudio();
  if (!a) return;
  a.loop = !a.loop;
  document.getElementById('rb-loop')?.classList.toggle('on', a.loop);
}

function rbRate() {
  const a = rbAudio();
  if (!a) return;
  rbRateIdx = (rbRateIdx + 1) % RATES.length;
  a.playbackRate = RATES[rbRateIdx];
  const el = document.getElementById('rb-rate');
  if (el) {
    el.textContent = `[${RATES[rbRateIdx]}x]`;
    el.classList.toggle('on', rbRateIdx !== 0);
  }
}

const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// the ribbon mirrors the player rather than owning it, so the controls at the
// top of the box and the ones at the bottom can never disagree
function wireRibbon(a) {
  if (!a) return;
  const play = document.getElementById('rb-play');
  const time = document.getElementById('rb-time');
  const paint = () => { if (play) play.textContent = a.paused ? '[play]' : '[pause]'; };
  a.addEventListener('play', paint);
  a.addEventListener('pause', paint);
  a.addEventListener('timeupdate', () => {
    if (time) time.textContent = clock(a.currentTime) +
      (isFinite(a.duration) ? ' / ' + clock(a.duration) : '');
  });
  paint();
}

function toggleBig(force) {
  const on = force !== undefined ? force : !activeWrap.classList.contains('big');
  activeWrap.classList.toggle('big', on);
  const btn = document.getElementById('big-btn');
  if (btn) {
    btn.innerHTML = on ? '[&gt;-&lt;]' : '[&lt;-&gt;]';   // pushing out, then pulling back in
    btn.classList.toggle('on', on);
    btn.title = on ? 'back to the page (or hit escape)'
                   : 'fill the screen — more room to write';
  }
  if (on) document.getElementById('notes-box')?.focus();
}

// clicking the dimmed margin puts it down, the way a modal should. the test
// is target === the container, so a click anywhere inside the box is ignored.
activeWrap.addEventListener('click', ev => {
  if (ev.target === activeWrap && activeWrap.classList.contains('big')) toggleBig(false);
});

// escape gets you out of the big view and only out of it — it never puts the
// hunk away, because losing your place is not what escape is for
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && activeWrap.classList.contains('big')) toggleBig(false);
});

async function setActive(id) {
  const r = await fetch('/api/hunk?id=' + encodeURIComponent(id));
  if (!r.ok) return;
  renderActive(await r.json());
}

async function randomPost() {
  const r = await fetch('/api/random?' + filterParams());
  if (!r.ok) return;
  renderActive(await r.json());
  window.scrollTo({top: 0, behavior: 'smooth'});
}

async function revealActive() {
  if (!activeHunk) return;
  const r = await fetch('/api/reveal', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({path: activeHunk.audio_path})
  });
  if (!r.ok) alert(await r.text());
}

// closing the tab mid-sentence: a normal fetch gets cancelled, a beacon does not
window.addEventListener('pagehide', () => {
  clearTimeout(notesTimer);
  const box = document.getElementById('notes-box');
  if (!box || !activeHunk || box.value === notesSaved) return;
  navigator.sendBeacon('/api/notes', new Blob(
    [JSON.stringify({id: activeHunk.id, text: box.value})], {type: 'application/json'}));
});

q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 200); });
search();
const savedActive = localStorage.getItem('compost.active');
if (savedActive) setActive(savedActive);
</script>
</body>
